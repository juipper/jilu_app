name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -5
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/jilu_app-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX 3 (for msi)
        continue-on-error: true
        run: choco install wixtoolset --version=3.14.1 -y --no-progress
      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { Add-Content -Path $env:GITHUB_PATH -Value $c; Write-Host "WiX found: $c" }
          }
      - name: Package MSI
        id: msi
        continue-on-error: true
        run: ./gradlew :desktop:packageMsi --no-daemon
      - name: Package portable app image
        run: ./gradlew :desktop:createDistributable --no-daemon
      - name: Collect MSI and ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (Test-Path "desktop/build/compose/binaries/main/msi") {
            Copy-Item desktop/build/compose/binaries/main/msi/*.msi "out/jilu_app-$env:GITHUB_REF_NAME-windows.msi"
          }
          $app = "desktop/build/compose/binaries/main/app/jilu_app"
          if (Test-Path $app) {
            Compress-Archive -Path $app -DestinationPath "out/jilu_app-$env:GITHUB_REF_NAME-windows.zip" -Force
          }
          Get-ChildItem out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package DMG
        run: ./gradlew :desktop:packageDmg --no-daemon
      - name: Collect DMG
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/dmg/*.dmg "out/jilu_app-${GITHUB_REF_NAME}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: out/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f -printf "%p %s bytes\n"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-package/*.msi
            artifacts/windows-package/*.zip
            artifacts/macos-dmg/*.dmg
