name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/jilu_app-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download WiX 3 binaries
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wix314.zip"
          Expand-Archive "$env:RUNNER_TEMP\wix314.zip" -DestinationPath "$env:RUNNER_TEMP\wix314" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\wix314"
          & "$env:RUNNER_TEMP\wix314\candle.exe" "-?" | Out-Null
          Write-Host "WiX ready"
      - name: Verify WiX on PATH
        shell: pwsh
        run: |
          where.exe candle.exe
          where.exe light.exe
      - name: Package MSI
        id: msi
        continue-on-error: true
        shell: pwsh
        run: |
          .\gradlew.bat :desktop:packageMsi --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath msi.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: MSI diagnostics to summary
        if: steps.msi.outcome == 'failure'
        shell: pwsh
        run: |
          "### MSI 失败日志" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content msi.log -Tail 60 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $bad = Select-String -Path msi.log -Pattern 'error|Error|Exception|FAILURE|失败' | Select-Object -Last 10
          foreach ($b in $bad) {
            $line = ($b.Line -replace '%','%25') -replace "`r",''
            Write-Host "::error::$line"
          }
          $err = Get-ChildItem -Path "desktop/build/compose/logs/packageMsi" -Filter '*-err.txt' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($err) {
            Write-Host "::error::JP| found log $($err.Name)"
            Get-Content $err.FullName -Tail 15 | ForEach-Object {
              $l = ($_ -replace '%','%25') -replace "`r",''
              Write-Host "::error::JP| $l"
            }
          } else {
            Write-Host "::error::JP| err log not found"
          }
          Get-Content msi.log -Tail 25 | ForEach-Object {
            $l = ($_ -replace '%','%25') -replace "`r",''
            if ($l.Trim().Length -gt 0) { Write-Host "::error::TAIL| $l" }
          }
      - name: Package portable app image
        run: .\gradlew.bat :desktop:createDistributable --no-daemon
      - name: Collect MSI and ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $msi = Get-ChildItem -Path "desktop/build/compose/binaries/main/msi" -Filter *.msi -ErrorAction SilentlyContinue
          if ($msi) {
            Copy-Item $msi.FullName "out/jilu_app-$env:GITHUB_REF_NAME-windows.msi"
          } else {
            Write-Host "::warning::MSI 没有生成，本次只有免安装 zip"
          }
          $app = "desktop/build/compose/binaries/main/app/jilu_app"
          if (Test-Path $app) {
            Compress-Archive -Path $app -DestinationPath "out/jilu_app-$env:GITHUB_REF_NAME-windows.zip" -Force
          }
          Get-ChildItem out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Package DMG
        run: ./gradlew :desktop:packageDmg --no-daemon
      - name: Collect DMG
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/dmg/*.dmg "out/jilu_app-${GITHUB_REF_NAME}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: out/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f -printf "%p %s bytes\n"
      - name: Delete previous release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-package/*.msi
            artifacts/windows-package/*.zip
            artifacts/macos-dmg/*.dmg
